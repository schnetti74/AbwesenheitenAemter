<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dienstplan Amtsträger · Boele &amp; Hohenlimburg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase (App + Firestore, compat build) -->
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root {
    --bg: #F5F0E4; --bg-alt: #ECE3D0; --card: #FFFDF7; --ink: #21293A; --ink-soft: #5B6579;
    --gold: #8C6A2F; --gold-strong: #6E5222; --border: #DED2B4;
    --green: #3E6E4F; --green-bg: #E3EEE3; --red: #A24438; --red-bg: #F4E4E1; --gray-bg: #EDE9DD;
    --blue: #3E5C8A; --blue-bg: #E3E9F2;
    --amber: #9C7B23; --amber-bg: #F2ECD8;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#171B26; --bg-alt:#1E2432; --card:#212736; --ink:#EAE4D3; --ink-soft:#A7A192;
      --gold:#D6B36E; --gold-strong:#E8C685; --border:#333B4D;
      --green:#8FC49E; --green-bg:#253A2C; --red:#E2988A; --red-bg:#3B2622; --gray-bg:#2A3040;
      --blue:#9FB4D9; --blue-bg:#232C3E; --amber:#E3C878; --amber-bg:#332C1B;
    }
  }
  :root[data-theme="dark"] {
    --bg:#171B26; --bg-alt:#1E2432; --card:#212736; --ink:#EAE4D3; --ink-soft:#A7A192;
    --gold:#D6B36E; --gold-strong:#E8C685; --border:#333B4D;
    --green:#8FC49E; --green-bg:#253A2C; --red:#E2988A; --red-bg:#3B2622; --gray-bg:#2A3040;
    --blue:#9FB4D9; --blue-bg:#232C3E; --amber:#E3C878; --amber-bg:#332C1B;
  }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { max-width: 680px; margin:0 auto; padding:0 16px 56px; }
  header.top { position:sticky; top:0; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:10; padding:18px 0 10px; border-bottom:1px solid var(--border); }
  h1 { font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:1.4rem; letter-spacing:-0.01em; margin:0 0 2px; }
  .place { font-size:0.85rem; color:var(--gold); font-weight:500; margin:0 0 12px; }
  .whoami { display:flex; align-items:center; justify-content:space-between; font-size:0.85rem; color:var(--ink-soft); flex-wrap:wrap; gap:6px; }
  .whoami button { background:none; border:none; color:var(--gold); font-weight:600; cursor:pointer; padding:4px 0; font-size:0.85rem; font-family:inherit; }
  nav.tabs { display:flex; gap:4px; margin-top:14px; flex-wrap:wrap; }
  nav.tabs button { flex:1; min-width:74px; background:var(--bg-alt); border:1px solid var(--border); color:var(--ink-soft); padding:9px 4px; border-radius:9px; font-size:0.78rem; font-weight:600; font-family:inherit; cursor:pointer; }
  nav.tabs button.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  section.view { display:none; padding-top:18px; }
  section.view.active { display:block; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .termin-date { font-family:'Fraunces',Georgia,serif; font-size:1.02rem; font-weight:500; margin:0 0 2px; }
  .termin-sub { font-size:0.82rem; color:var(--ink-soft); margin:0 0 10px; }
  .tag { display:inline-block; font-size:0.68rem; font-weight:700; padding:2px 8px; border-radius:20px; margin-right:6px; letter-spacing:0.01em; }
  .tag.gemeinsam { background:var(--amber-bg); color:var(--amber); }
  .tag.boele { background:var(--blue-bg); color:var(--blue); }
  .tag.hohenlimburg { background:var(--green-bg); color:var(--green); }
  .status-row { display:flex; gap:6px; margin-top:10px; }
  .status-btn { flex:1; padding:9px 4px; border-radius:8px; border:1px solid var(--border); background:var(--bg-alt); color:var(--ink-soft); font-family:inherit; font-size:0.8rem; font-weight:600; cursor:pointer; }
  .status-btn.sel-anwesend { background:var(--green-bg); border-color:var(--green); color:var(--green); }
  .status-btn.sel-abwesend { background:var(--red-bg); border-color:var(--red); color:var(--red); }
  .status-btn.sel-offen { background:var(--gray-bg); border-color:var(--ink-soft); color:var(--ink-soft); }
  .empty { text-align:center; color:var(--ink-soft); font-size:0.9rem; padding:36px 10px; }
  .filter-row { display:flex; gap:6px; margin-bottom:14px; }
  .filter-row button { flex:1; padding:8px 4px; border-radius:8px; border:1px solid var(--border); background:var(--bg-alt); color:var(--ink-soft); font-family:inherit; font-size:0.78rem; font-weight:600; cursor:pointer; }
  .filter-row button.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .matrix-scroll { overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--card); margin-bottom:14px; }
  table.matrix { border-collapse:collapse; width:100%; font-size:0.8rem; }
  table.matrix th, table.matrix td { padding:8px 10px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
  table.matrix th.namecol { font-weight:600; color:var(--ink-soft); font-size:0.72rem; }
  table.matrix td.datecell { font-weight:600; }
  table.matrix td.datecell .sub { display:block; font-weight:400; color:var(--ink-soft); font-size:0.7rem; }
  .badge { display:inline-block; width:22px; height:22px; line-height:22px; text-align:center; border-radius:6px; font-size:0.8rem; position:relative; }
  .badge.anwesend { background:var(--green-bg); color:var(--green); }
  .badge.abwesend { background:var(--red-bg); color:var(--red); }
  .badge.offen { background:var(--gray-bg); color:var(--ink-soft); }
  .badge.has-bem::after { content:''; position:absolute; top:-2px; right:-2px; width:7px; height:7px; border-radius:50%; background:var(--gold-strong); }
  .ueb-card { padding:0; overflow:hidden; }
  .ueb-head { padding:14px 16px; cursor:pointer; }
  .ueb-toggle { display:block; font-size:0.78rem; color:var(--gold); font-weight:600; margin-top:8px; }
  .ueb-persons { padding:0 16px 14px; border-top:1px solid var(--border); margin-top:2px; }
  .person-row { display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid var(--border); }
  .person-row:first-child { border-top:none; }
  .person-name { flex:1; font-size:0.85rem; }
  .person-status { font-size:0.76rem; color:var(--ink-soft); }
  .person-bem { font-size:0.8rem; color:var(--ink-soft); font-style:italic; padding:0 0 7px 30px; }
  .ur-chart { overflow-x:auto; }
  .ur-months { display:flex; padding-left:98px; margin:10px 0 4px; min-width:340px; }
  .ur-months span { flex:1; font-size:0.66rem; color:var(--ink-soft); }
  .ur-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--border); min-width:340px; }
  .ur-name { width:90px; flex-shrink:0; font-size:0.78rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ur-track { position:relative; flex:1; height:18px; background:var(--bg-alt); border-radius:4px; }
  .ur-bar { position:absolute; top:0; height:100%; background:var(--gold-strong); border-radius:4px; min-width:3px; }
  label { display:block; font-size:0.78rem; font-weight:600; color:var(--ink-soft); margin:12px 0 5px; }
  label:first-child { margin-top:0; }
  input[type=text], input[type=date], input[type=time], input[type=password], input[type=month], select, textarea {
    width:100%; padding:10px 11px; border-radius:8px; border:1px solid var(--border); background:var(--bg-alt); color:var(--ink); font-family:inherit; font-size:0.92rem;
  }
  textarea { resize:vertical; min-height:110px; line-height:1.5; }
  .dl-preview { padding-left:18px; margin:8px 0; font-size:0.82rem; color:var(--ink-soft); }
  .dl-preview li { padding:2px 0; }
  input:focus, select:focus, .status-btn:focus-visible, button:focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
  .checkline { display:flex; align-items:center; gap:8px; margin-top:12px; }
  .checkline input[type=checkbox] { width:18px; height:18px; }
  .checkline label { margin:0; }
  .btn-primary { margin-top:16px; width:100%; background:var(--gold-strong); color:#FFFDF7; border:none; padding:12px; border-radius:9px; font-family:inherit; font-weight:600; font-size:0.92rem; cursor:pointer; }
  .btn-secondary { background:none; border:1px solid var(--border); color:var(--ink-soft); padding:6px 10px; border-radius:7px; font-family:inherit; font-size:0.74rem; cursor:pointer; }
  .btn-danger { color:var(--red); border-color:var(--red); }
  .hint { font-size:0.78rem; color:var(--ink-soft); margin-top:6px; }
  .error-msg { color:var(--red); font-size:0.82rem; margin-top:8px; }
  .ok-msg { color:var(--green); font-size:0.82rem; margin-top:8px; }
  .row-actions { display:flex; gap:6px; }
  .termin-admin-row { padding:10px 0; border-bottom:1px solid var(--border); }
  .termin-admin-row:last-child { border-bottom:none; }
  .termin-admin-row .top-line { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .termin-admin-row .info { font-size:0.85rem; }
  .termin-admin-row .info .sub { color:var(--ink-soft); font-size:0.74rem; }
  .edit-box { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
  .section-title { font-family:'Fraunces',Georgia,serif; font-size:1.02rem; font-weight:500; margin:0 0 4px; }
  .am-row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:0.86rem; gap:8px; flex-wrap:wrap; }
  .am-row:last-child { border-bottom:none; }
  .am-row select { width:auto; min-width:100px; flex:1; }
  .am-row .btn-secondary { flex-shrink:0; }
  #onboarding { display:flex; align-items:center; min-height:100vh; min-height:100%; padding:24px 16px; }
  .onb-box { max-width:420px; margin:0 auto; width:100%; }
  .onb-box h1 { font-size:1.6rem; margin-bottom:8px; }
  .onb-box p { color:var(--ink-soft); font-size:0.92rem; line-height:1.5; }
  #onbPinWrap { margin-top: 4px; }
  .gcard { display:flex; gap:8px; margin-top:6px; }
  .gcard button { flex:1; padding:12px 6px; border-radius:9px; border:1px solid var(--border); background:var(--bg-alt); color:var(--ink); font-family:inherit; font-weight:600; font-size:0.9rem; cursor:pointer; }
  .gcard button.sel { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  #setupNotice { background:var(--red-bg); color:var(--red); border:1px solid var(--red); border-radius:10px; padding:12px 14px; font-size:0.85rem; margin:16px; }
</style>
</head>
<body>

<div id="setupNoticeWrap"></div>

<div id="onboarding" style="display:none;">
  <div class="onb-box">
    <p class="place" style="margin-bottom:6px;">Dienstplan Amtsträger</p>
    <h1>Wer bist du?</h1>
    <p>Trage deinen Namen ein und wähle deine Gemeinde sowie dein Amt, um Gottesdienste als anwesend oder abwesend zu markieren.</p>
    <label for="nameInput">Name</label>
    <input type="text" id="nameInput" placeholder="Vor- und Nachname" autocomplete="name">
    <label>Gemeinde</label>
    <div class="gcard">
      <button type="button" id="gBoele" data-g="boele">Boele</button>
      <button type="button" id="gHohenlimburg" data-g="hohenlimburg">Hohenlimburg</button>
    </div>
    <label>Amt</label>
    <div class="gcard">
      <button type="button" id="rDiakon" data-r="diakon">Diakon</button>
      <button type="button" id="rPriester" data-r="priester">Priester</button>
    </div>
    <label>Administrator</label>
    <div class="gcard">
      <button type="button" id="aJa" data-a="ja">Ja</button>
      <button type="button" id="aNein" data-a="nein">Nein</button>
    </div>
    <div id="onbPinWrap" style="display:none;">
      <label for="onbAdminPin">Admin-Zugangscode</label>
      <input type="password" id="onbAdminPin" inputmode="numeric" placeholder="Code">
      <div id="onbPinError" class="error-msg" style="display:none;"></div>
    </div>
    <button class="btn-primary" id="startBtn">Loslegen</button>
  </div>
</div>

<div class="wrap" id="appWrap" style="display:none;">
  <header class="top">
    <h1>Dienstplan Amtsträger</h1>
    <p class="place">Boele &amp; Hohenlimburg</p>
    <div class="whoami">
      <span>Angemeldet als <strong id="whoName"></strong> <span id="whoGemeinde" class="tag"></span> <span id="whoRolle" class="tag"></span></span>
      <button id="switchBtn">Wechseln</button>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="meine">Meine Termine</button>
      <button class="tab-btn" data-tab="uebersicht">Übersicht</button>
      <button class="tab-btn" data-tab="urlaub">Urlaub</button>
      <button class="tab-btn" data-tab="admin">Termine</button>
    </nav>
  </header>

  <section class="view active" id="view-meine">
    <div id="urlaubMeinBox"></div>
    <div id="meineList"></div>
  </section>

  <section class="view" id="view-uebersicht">
    <div class="filter-row" id="uebFilter"></div>
    <div id="uebersichtWrap"></div>
  </section>

  <section class="view" id="view-urlaub">
    <div class="filter-row" id="urlFilter"></div>
    <div id="urlaubWrap"></div>
  </section>

  <section class="view" id="view-admin">
    <div id="adminWrap"></div>
  </section>
</div>

<script>
(function(){
  // ============================================================
  // FIREBASE-KONFIGURATION — hier deine eigenen Werte eintragen.
  // Firebase-Konsole → Projekteinstellungen → "Meine Apps" → Web-App
  // → Feld "firebaseConfig".
  // ============================================================
  var firebaseConfig = {
    apiKey: "AIzaSyCb3NYSuzpspiq2YipoX3-tTqa6L1RIxdU",
    authDomain: "anwesenheitenamtstraeger.firebaseapp.com",
    projectId: "anwesenheitenamtstraeger",
    storageBucket: "anwesenheitenamtstraeger.firebasestorage.app",
    messagingSenderId: "996432634826",
    appId: "1:996432634826:web:96dd924745f96350afa533"
  };
  // ============================================================

  var CONFIGURED = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('DEIN_') !== 0;
  var db = null;

  if (CONFIGURED) {
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch(e) {
      CONFIGURED = false;
    }
  }

  if (!CONFIGURED) {
    document.getElementById('setupNoticeWrap').innerHTML =
      '<div id="setupNotice">Diese App ist noch nicht eingerichtet: Bitte in der Datei den Abschnitt ' +
      '<code>firebaseConfig</code> am Anfang des Skripts mit den eigenen Firebase-Zugangsdaten ausfüllen.</div>';
  }

  var GEMEINDEN = { boele: 'Boele', hohenlimburg: 'Hohenlimburg' };
  var ROLLEN = { diakon: 'Diakon', priester: 'Priester' };

  var myName = null, mySlug = null, myGemeinde = null, myRolle = null;
  var termine = [];
  var amtstraeger = [];
  var statusList = [];
  var urlaubList = [];
  var activeTab = 'meine';
  var uebFilter = 'boele';
  var urlFilter = 'boele';
  var selectedOnboardG = null;
  var selectedOnboardR = null;
  var selectedOnboardA = 'nein';
  var adminUnlocked = false;

  function slugify(s){
    return (s||'').trim().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'person';
  }
  function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
  var WOCHENTAGE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  function fmtDatum(iso){
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d.getTime())) return { tag: iso, datum: '' };
    var tag = WOCHENTAGE[d.getDay()];
    var datum = String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
    return { tag: tag, datum: datum };
  }
  function sortByDatumZeit(a,b){
    var da = (a.datum||'') + ' ' + (a.uhrzeit||'');
    var db_ = (b.datum||'') + ' ' + (b.uhrzeit||'');
    return da < db_ ? -1 : da > db_ ? 1 : 0;
  }
  function todayIso(){ return new Date().toISOString().slice(0,10); }
  var MONATSNAMEN = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  function monthOptionsHtml(){
    var opts = '';
    var now = new Date();
    for (var i=0;i<3;i++){
      var d = new Date(now.getFullYear(), now.getMonth()+i, 1);
      var val = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      opts += '<option value="' + val + '">' + MONATSNAMEN[d.getMonth()] + ' ' + d.getFullYear() + '</option>';
    }
    return opts;
  }

  // ---------- onboarding ----------
  var savedName = null, savedGemeinde = null, savedRolle = null, savedIsAdmin = null;
  try { savedName = localStorage.getItem('dp_name'); savedGemeinde = localStorage.getItem('dp_gemeinde'); savedRolle = localStorage.getItem('dp_rolle'); savedIsAdmin = localStorage.getItem('dp_isadmin'); } catch(e){}

  function showOnboarding(){
    document.getElementById('onboarding').style.display = 'flex';
    document.getElementById('appWrap').style.display = 'none';
  }
  function showApp(){
    document.getElementById('onboarding').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
    document.getElementById('whoName').textContent = myName;
    var wg = document.getElementById('whoGemeinde');
    wg.textContent = GEMEINDEN[myGemeinde] || '';
    wg.className = 'tag ' + myGemeinde;
    var wr = document.getElementById('whoRolle');
    wr.textContent = ROLLEN[myRolle] || '';
    wr.className = 'tag gemeinsam';
    var termineTabBtn = document.querySelector('.tab-btn[data-tab="admin"]');
    if (termineTabBtn) termineTabBtn.style.display = adminUnlocked ? '' : 'none';
    buildUebFilter();
  }

  document.getElementById('gBoele').addEventListener('click', function(){ selectG('boele'); });
  document.getElementById('gHohenlimburg').addEventListener('click', function(){ selectG('hohenlimburg'); });
  function selectG(g){
    selectedOnboardG = g;
    document.getElementById('gBoele').classList.toggle('sel', g==='boele');
    document.getElementById('gHohenlimburg').classList.toggle('sel', g==='hohenlimburg');
  }
  document.getElementById('rDiakon').addEventListener('click', function(){ selectR('diakon'); });
  document.getElementById('rPriester').addEventListener('click', function(){ selectR('priester'); });
  function selectR(r){
    selectedOnboardR = r;
    document.getElementById('rDiakon').classList.toggle('sel', r==='diakon');
    document.getElementById('rPriester').classList.toggle('sel', r==='priester');
  }
  document.getElementById('aJa').addEventListener('click', function(){ selectA('ja'); });
  document.getElementById('aNein').addEventListener('click', function(){ selectA('nein'); });
  function selectA(a){
    selectedOnboardA = a;
    document.getElementById('aJa').classList.toggle('sel', a==='ja');
    document.getElementById('aNein').classList.toggle('sel', a==='nein');
    document.getElementById('onbPinWrap').style.display = (a==='ja') ? 'block' : 'none';
    document.getElementById('onbPinError').style.display = 'none';
  }
  function verifyOrSetAdminPin(pin, callback){
    if (!db) { callback(false); return; }
    db.doc('config/admin').get().then(function(snap){
      if (!snap.exists) {
        db.doc('config/admin').set({ pin: pin }).then(function(){ callback(true); }).catch(function(){ callback(false); });
        return;
      }
      var data = snap.data();
      callback(!!(data && data.pin === pin));
    }).catch(function(){ callback(false); });
  }
  function finishOnboarding(v, isAdmin){
    try {
      localStorage.setItem('dp_name', v);
      localStorage.setItem('dp_gemeinde', selectedOnboardG);
      localStorage.setItem('dp_rolle', selectedOnboardR);
      localStorage.setItem('dp_isadmin', isAdmin ? '1' : '0');
    } catch(e){}
    adminUnlocked = isAdmin;
    initPerson(v, selectedOnboardG, selectedOnboardR);
  }
  document.getElementById('startBtn').addEventListener('click', function(){
    var v = document.getElementById('nameInput').value.trim();
    if (!v || !selectedOnboardG || !selectedOnboardR) return;
    if (selectedOnboardA === 'ja') {
      var pin = document.getElementById('onbAdminPin').value.trim();
      var perr = document.getElementById('onbPinError');
      if (!pin) { perr.textContent = 'Bitte einen Zugangscode eingeben.'; perr.style.display = 'block'; return; }
      perr.style.display = 'none';
      verifyOrSetAdminPin(pin, function(ok){
        if (!ok) { perr.textContent = 'Code ist nicht korrekt.'; perr.style.display = 'block'; return; }
        finishOnboarding(v, true);
      });
    } else {
      finishOnboarding(v, false);
    }
  });
  document.getElementById('nameInput').addEventListener('keydown', function(e){ if (e.key==='Enter') document.getElementById('startBtn').click(); });
  document.getElementById('switchBtn').addEventListener('click', function(){

      localStorage.removeItem('dp_rolle'); localStorage.removeItem('dp_isadmin');
    } catch(e){}

  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');

      document.getElementById('view-' + activeTab).classList.add('active');

  // ---------- data ----------
  function initPerson(name, gemeinde, rolle){
    myName = name; mySlug = slugify(name); myGemeinde = gemeinde; myRolle = rolle;
    showApp();
    if (!db) return;
    db.collection('amtstraeger').doc(mySlug).get().then(function(snap){
      if (!snap.exists) {
        db.collection('amtstraeger').doc(mySlug).set({ name: myName, gemeinde: myGemeinde, rolle: myRolle, createdAt: new Date().toISOString() }).catch(function(){});
      } else {
        var data = snap.data();
        var updates = {};
        if (data && data.gemeinde !== myGemeinde) updates.gemeinde = myGemeinde;
        if (data && data.rolle !== myRolle) updates.rolle = myRolle;
        if (Object.keys(updates).length) {
          db.collection('amtstraeger').doc(mySlug).update(updates).catch(function(){});
        }
      }
    }).catch(function(){});
    renderMeine();
  }

  function subscribeAll(){
    db.collection('termine').onSnapshot(function(snap){
      termine = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      termine.sort(sortByDatumZeit);
      reconcileUrlaubStatus();
      renderMeine(); renderUebersicht(); renderAdmin();
    }, function(){});
    db.collection('amtstraeger').onSnapshot(function(snap){
      amtstraeger = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      amtstraeger.sort(function(a,b){ return (a.name||'').localeCompare(b.name||'', 'de'); });
      renderUebersicht(); renderAdmin();
    }, function(){});
    db.collection('status').onSnapshot(function(snap){
      statusList = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      renderMeine(); renderUebersicht();
    }, function(){});
    db.collection('urlaub').onSnapshot(function(snap){
      urlaubList = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      urlaubList.sort(function(a,b){ return (a.von||'') < (b.von||'') ? -1 : 1; });
      reconcileUrlaubStatus();
      renderMeine(); renderUebersicht(); renderUrlaub();
    }, function(){});
  }

  function myBemerkung(terminId){
    var docId = terminId + '__' + mySlug;
    var f = statusList.find(function(s){ return s.id === docId; });
    return f && f.bemerkung ? f.bemerkung : '';
  }
  function setMyStatus(terminId, status){
    if (!db) return;
    var docId = terminId + '__' + mySlug;
    db.collection('status').doc(docId).set({
      terminId: terminId, amtstraegerId: mySlug, name: myName, gemeinde: myGemeinde,
      status: status, autoUrlaub: false, updatedAt: new Date().toISOString()
    }, { merge: true }).catch(function(){});
  }
  function setMyBemerkung(terminId, text){
    if (!db) return;
    var docId = terminId + '__' + mySlug;
    db.collection('status').doc(docId).set({
      terminId: terminId, amtstraegerId: mySlug, name: myName, gemeinde: myGemeinde,
      bemerkung: text || null, autoUrlaub: false, updatedAt: new Date().toISOString()
    }, { merge: true }).catch(function(){});
  }
  function isAutoUrlaubStatus(terminId, amtstraegerId){
    var docId = terminId + '__' + amtstraegerId;
    var f = statusList.find(function(s){ return s.id === docId; });
    return !!(f && f.autoUrlaub);
  }
  function bemerkungOf(terminId, amtstraegerId){
    var docId = terminId + '__' + amtstraegerId;
    var f = statusList.find(function(s){ return s.id === docId; });
    return f && f.bemerkung ? f.bemerkung : '';
  }

  // ---------- Urlaub ----------
  function isOnUrlaub(amtstraegerId, datum){
    return urlaubList.some(function(u){
      return u.amtstraegerId === amtstraegerId && u.von <= datum && datum <= u.bis;
    });
  }
  function hasExplicitStatus(terminId, amtstraegerId){
    var docId = terminId + '__' + amtstraegerId;
    return statusList.some(function(s){ return s.id === docId && s.status; });
  }
  function effectiveStatus(t, amtstraegerId){
    var docId = t.id + '__' + amtstraegerId;
    var f = statusList.find(function(s){ return s.id === docId; });
    if (f && f.status) return f.status;
    if (isOnUrlaub(amtstraegerId, t.datum)) return 'abwesend';
    return 'offen';
  }
  function effektiveBemerkung(t, amtstraegerId){
    var bem = bemerkungOf(t.id, amtstraegerId);
    if (bem) return bem;
    if (!hasExplicitStatus(t.id, amtstraegerId) && isOnUrlaub(amtstraegerId, t.datum)) return 'Urlaub';
    return '';
  }
  function myUrlaub(){
    // Urlaube, die vollständig in einem vergangenen Jahr liegen, werden hier nicht mehr
    // angezeigt, sobald ein neues Jahr begonnen hat.
    var yearStart = new Date().getFullYear() + '-01-01';
    return urlaubList.filter(function(u){ return u.amtstraegerId === mySlug && (u.bis||'') >= yearStart; });
  }
  function addUrlaub(von, bis){
    if (!db) return;
    db.collection('urlaub').add({
      amtstraegerId: mySlug, name: myName, gemeinde: myGemeinde,
      von: von, bis: bis, createdAt: new Date().toISOString()
    }).then(function(){ reconcileUrlaubStatus(); }).catch(function(){});
  }
  function deleteUrlaub(id){
    if (!db) return;
    var u = urlaubList.find(function(x){ return x.id === id; });
    db.collection('urlaub').doc(id).delete().then(function(){
      if (!u) return;
      // Automatisch (per Urlaub) gesetzte Status im betroffenen Zeitraum wieder zurücknehmen,
      // manuell gesetzte/überschriebene Status bleiben unangetastet.
      termine.forEach(function(t){
        if ((t.datum||'') < u.von || (t.datum||'') > u.bis) return;
        if (!t.gemeinsam && t.gemeinde !== u.gemeinde) return;
        var docId = t.id + '__' + u.amtstraegerId;
        var s = statusList.find(function(x){ return x.id === docId; });
        if (s && s.autoUrlaub) {
          db.collection('status').doc(docId).delete().catch(function(){});
        }
      });
    }).catch(function(){});
  }
  function reconcileUrlaubStatus(){
    if (!db) return;
    termine.forEach(function(t){
      urlaubList.forEach(function(u){
        if ((t.datum||'') < u.von || (t.datum||'') > u.bis) return;
        if (!t.gemeinsam && t.gemeinde !== u.gemeinde) return;
        var docId = t.id + '__' + u.amtstraegerId;
        var already = statusList.some(function(s){ return s.id === docId; });
        if (already) return;
        db.collection('status').doc(docId).set({
          terminId: t.id, amtstraegerId: u.amtstraegerId, name: u.name, gemeinde: u.gemeinde,
          status: 'abwesend', bemerkung: 'Urlaub', autoUrlaub: true, updatedAt: new Date().toISOString()
        }, { merge: true }).catch(function(){});
      });
    });
  }

  function tagHtml(t){
    if (t.gemeinsam) {
      var ortLabel = t.ort ? (' · in ' + (GEMEINDEN[t.ort]||'')) : '';
      return '<span class="tag gemeinsam">Gemeinsam' + ortLabel + '</span>';
    }
    return '<span class="tag ' + t.gemeinde + '">' + (GEMEINDEN[t.gemeinde]||'') + '</span>';
  }

  function renderMeine(){
    var el = document.getElementById('meineList');
    if (!myName) return;
    var today = todayIso();
    var relevant = termine.filter(function(t){
      return (t.datum||'') >= today && (t.gemeinsam || t.gemeinde === myGemeinde);
    });
    if (!relevant.length) {
      el.innerHTML = '<div class="empty">Keine anstehenden Termine für deine Gemeinde.</div>';
      renderMeinUrlaubBox();
      return;
    }
    el.innerHTML = '';
    relevant.forEach(function(t){
      var f = fmtDatum(t.datum);
      var st = effectiveStatus(t, mySlug);
      var bem = myBemerkung(t.id);
      var aufUrlaub = isAutoUrlaubStatus(t.id, mySlug);
      var dl = t.dienstleiter ? ('<br>Dienstleiter: ' + escapeHtml(t.dienstleiter)) : '';
      var urlaubHint = aufUrlaub ? '<p class="hint" style="color:var(--gold);margin-top:8px;">Automatisch als abwesend markiert (Urlaub eingetragen). Bei Bedarf oben überschreiben.</p>' : '';
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        tagHtml(t) +
        '<p class="termin-date">' + f.tag + ', ' + f.datum + (t.uhrzeit ? ' · ' + t.uhrzeit + ' Uhr' : '') + '</p>' +
        '<p class="termin-sub">' + escapeHtml(t.bezeichnung || 'Gottesdienst') + dl + '</p>' +
        '<div class="status-row">' +
          '<button class="status-btn sb-anwesend' + (st==='anwesend'?' sel-anwesend':'') + '">Anwesend</button>' +
          '<button class="status-btn sb-abwesend' + (st==='abwesend'?' sel-abwesend':'') + '">Abwesend</button>' +
          '<button class="status-btn sb-offen' + (st==='offen'?' sel-offen':'') + '">Offen</button>' +
        '</div>' +
        urlaubHint +
        '<label style="margin-top:10px;">Bemerkung (sichtbar für alle in der Übersicht)</label>' +
        '<input type="text" class="bem-input" placeholder="z. B. komme später" value="' + escapeHtml(bem) + '">';
      card.querySelector('.sb-anwesend').addEventListener('click', function(){ setMyStatus(t.id, 'anwesend'); });
      card.querySelector('.sb-abwesend').addEventListener('click', function(){ setMyStatus(t.id, 'abwesend'); });
      card.querySelector('.sb-offen').addEventListener('click', function(){ setMyStatus(t.id, 'offen'); });
      var bemInput = card.querySelector('.bem-input');
      bemInput.addEventListener('blur', function(){ setMyBemerkung(t.id, bemInput.value.trim()); });
      bemInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') bemInput.blur(); });
      el.appendChild(card);
    });
    renderMeinUrlaubBox();
  }

  var urlaubBoxOpen = false;

    var list = myUrlaub();

        '<p class="section-title" style="margin-bottom:2px;">Meine Urlaubstage</p>' +

        '<span class="ueb-toggle">' + (urlaubBoxOpen ? 'Einklappen ▴' : 'Aufklappen ▾') + '</span>' +
      '</div>' +
      '<div class="ueb-persons" id="urlaubBoxBody" style="display:' + (urlaubBoxOpen ? 'block' : 'none') + ';">' +
        '<p class="termin-sub" style="margin-top:10px;">Wird automatisch bei „Meine Termine" und in der Übersicht als Abwesend berücksichtigt – auch für Termine, die noch nicht angelegt sind.</p>' +
        '<label for="urlVon">Von</label><input type="date" id="urlVon">' +
        '<label for="urlBis">Bis</label><input type="date" id="urlBis">' +

    box.querySelector('#urlaubBoxHead').addEventListener('click', function(){

    box.querySelector('#urlAddBtn').addEventListener('click', function(){
      var von = box.querySelector('#urlVon').value;

      var err = box.querySelector('#urlError');
      if (!von || !bis) { err.textContent = 'Bitte Von- und Bis-Datum wählen.'; err.style.display = 'block'; return; }
      if (bis < von) { err.textContent = 'Das Bis-Datum darf nicht vor dem Von-Datum liegen.'; err.style.display = 'block'; return; }
      err.style.display = 'none';
      addUrlaub(von, bis);
      box.querySelector('#urlVon').value = '';
      box.querySelector('#urlBis').value = '';

  var STATUS_SYMBOL = { anwesend:'✓', abwesend:'✕', offen:'–' };

  function buildUebFilter(){
    var wrap = document.getElementById('uebFilter');
    if (!wrap || !myGemeinde) return;
    var buttons;
    if (adminUnlocked) {
      buttons = [
        { f: 'boele', label: 'Boele' },
        { f: 'hohenlimburg', label: 'Hohenlimburg' }
      ];
    } else {
      buttons = [
        { f: myGemeinde, label: GEMEINDEN[myGemeinde] || '' }
      ];
    }
    if (!buttons.some(function(b){ return b.f === uebFilter; })) {
      uebFilter = buttons[0].f;
    }
    wrap.innerHTML = '';
    if (buttons.length < 2) {
      wrap.style.display = 'none';
      return;
    }
    wrap.style.display = 'flex';

  var MONATSKUERZEL = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  function dayOfYear(iso){
    var d = new Date(iso + 'T00:00:00');
    var start = new Date(d.getFullYear(), 0, 1);
    return Math.floor((d - start) / 86400000) + 1;
  }
  function isLeapYear(y){ return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }

  function relevantYears(cols){
    var currentYear = new Date().getFullYear();
    var ids = cols.map(function(c){ return c.id; });
    var years = {};
    years[currentYear] = true;
    urlaubList.forEach(function(u){
      if (ids.indexOf(u.amtstraegerId) === -1) return;
      var vy = parseInt((u.von||'').slice(0,4), 10);
      var by = parseInt((u.bis||'').slice(0,4), 10);
      if (!vy || !by) return;
      for (var y = vy; y <= by; y++) {
        if (y >= currentYear) years[y] = true;
      }
    });
    return Object.keys(years).map(Number).sort(function(a,b){ return a-b; });
  }

  function yearChartHtml(year, cols){
    var daysInYear = isLeapYear(year) ? 366 : 365;
    var yearStart = year + '-01-01', yearEnd = year + '-12-31';

    var monthLine = '<div class="ur-months">';
    for (var m = 0; m < 12; m++) {
      monthLine += '<span>' + MONATSKUERZEL[m] + '</span>';
    }
    monthLine += '</div>';

    var rows = '';
    cols.forEach(function(g){
      var ranges = urlaubList.filter(function(u){
        return u.amtstraegerId === g.id && u.bis >= yearStart && u.von <= yearEnd;
      });
      var bars = '';
      ranges.forEach(function(u){
        var von = u.von < yearStart ? yearStart : u.von;
        var bis = u.bis > yearEnd ? yearEnd : u.bis;
        var startPct = ((dayOfYear(von) - 1) / daysInYear) * 100;
        var widthPct = Math.max(((dayOfYear(bis) - dayOfYear(von) + 1) / daysInYear) * 100, 0.8);
        var fv = fmtDatum(u.von), fb = fmtDatum(u.bis);
        bars += '<div class="ur-bar" style="left:' + startPct.toFixed(2) + '%;width:' + widthPct.toFixed(2) + '%;" title="' + escapeHtml(g.name) + ': ' + fv.datum + ' – ' + fb.datum + '"></div>';
      });
      rows += '<div class="ur-row">' +
        '<div class="ur-name">' + escapeHtml(g.name) + '</div>' +
        '<div class="ur-track">' + bars + '</div>' +
      '</div>';
    });

    return '<div class="card ur-chart">' +
      '<p class="section-title">Urlaub ' + year + ' · ' + (GEMEINDEN[urlFilter]||'') + '</p>' +
      monthLine + rows +
      '</div>';
  }

  function renderUrlaub(){
    var el = document.getElementById('urlaubWrap');
    if (!myGemeinde) return;
    var cols = amtstraeger.filter(function(a){ return a.gemeinde === urlFilter; });
    cols.sort(function(a,b){
      var ra = a.rolle === 'priester' ? 0 : 1;
      var rb = b.rolle === 'priester' ? 0 : 1;
      if (ra !== rb) return ra - rb;
      return (a.name||'').localeCompare(b.name||'', 'de');
    });
    if (!cols.length) {
      el.innerHTML = '<div class="empty">Noch keine Amtsträger für diese Gemeinde eingetragen.</div>';
      return;
    }
    var years = relevantYears(cols);
    var html = '';
    years.forEach(function(y){
      html += yearChartHtml(y, cols);
    });
    el.innerHTML = html;
  }

  function countRoles(t, cols){
    var p = 0, d = 0;
    cols.forEach(function(g){
      if (effectiveStatus(t, g.id) === 'anwesend') {
        if (g.rolle === 'priester') p++;
        else if (g.rolle === 'diakon') d++;
      }
    });
    return { p: p, d: d };
  }

  var STATUS_LABEL = { anwesend:'Anwesend', abwesend:'Abwesend', offen:'Offen' };

  function personListHtml(t, cols){
    var html = '';
    cols.forEach(function(g){
      var st = effectiveStatus(t, g.id);
      var bem = effektiveBemerkung(t, g.id);
      var extra = ROLLEN[g.rolle] || '';
      if (t.gemeinsam) extra += ' · ' + (GEMEINDEN[g.gemeinde] || '');
      html += '<div class="person-row"><span class="badge ' + st + '">' + STATUS_SYMBOL[st] + '</span>' +
        '<span class="person-name">' + escapeHtml(g.name) + ' <span class="hint" style="margin:0;">(' + extra + ')</span></span>' +
        '<span class="person-status">' + STATUS_LABEL[st] + '</span></div>';
      if (bem) {
        html += '<div class="person-bem">„' + escapeHtml(bem) + '"</div>';
      }
    });
    return html;
  }

  function renderUebersicht(){
    var el = document.getElementById('uebersichtWrap');
    var today = todayIso();
    var rows = termine.filter(function(t){
      return (t.datum||'') >= today && ((t.gemeinsam) || (!t.gemeinsam && t.gemeinde === uebFilter));
    });
    var cols = amtstraeger.filter(function(a){ return a.gemeinde === uebFilter; });
    var otherGemeinde = uebFilter === 'boele' ? 'hohenlimburg' : 'boele';
    var otherCols = amtstraeger.filter(function(a){ return a.gemeinde === otherGemeinde; });
    if (!rows.length || !cols.length) {
      el.innerHTML = '<div class="empty">Noch keine Daten für diese Auswahl.</div>';
      return;
    }

    var html = '';
    rows.forEach(function(t){
      var f = fmtDatum(t.datum);
      var rowCols = t.gemeinsam ? cols.concat(otherCols) : cols;
      var rc = countRoles(t, rowCols);
      var dlHint = t.dienstleiter ? (' · Dienstleiter: ' + escapeHtml(t.dienstleiter)) : '';
      html += '<div class="card ueb-card">' +
        '<div class="ueb-head" data-tid="' + t.id + '">' +
          tagHtml(t) +
          '<p class="termin-date">' + f.tag + ', ' + f.datum + (t.uhrzeit ? ' · ' + t.uhrzeit + ' Uhr' : '') + '</p>' +
          '<p class="termin-sub">' + escapeHtml(t.bezeichnung||'') + dlHint + '<br>' + rc.p + ' Priester, ' + rc.d + ' Diakone anwesend</p>' +
          '<span class="ueb-toggle">Personen anzeigen ▾</span>' +
        '</div>' +
        '<div class="ueb-persons" style="display:none;">' + personListHtml(t, rowCols) + '</div>' +
      '</div>';
    });
    el.innerHTML = html;

    el.querySelectorAll('.ueb-head').forEach(function(head){
      head.addEventListener('click', function(){
        var card = head.closest('.ueb-card');
        var persons = card.querySelector('.ueb-persons');
        var toggle = head.querySelector('.ueb-toggle');
        var open = persons.style.display !== 'none';
        persons.style.display = open ? 'none' : 'block';
        toggle.textContent = open ? 'Personen ausblenden ▴' : 'Personen anzeigen ▾';
      });
    });
  }

  // ---------- admin ----------
  function renderAdmin(){
    var el = document.getElementById('adminWrap');
    if (!db) { el.innerHTML = '<div class="empty">Firebase ist noch nicht eingerichtet.</div>'; return; }
    if (!adminUnlocked) { el.innerHTML = '<div class="empty">Kein Zugriff.</div>'; return; }

    var html = '';

    html += '<div class="card">' +
      '<p class="section-title">Serientermine für einen Monat</p>' +
      '<p class="termin-sub">Erstellt für jeden Mittwoch einen gemeinsamen Termin (19:30), für jeden Sonntag je einen Termin pro Gemeinde (10:00) sowie eine Ämterstunde (19:30) am Donnerstag nach dem ersten Sonntag des Monats, am jeweils anderen Ort als die Mittwochsgottesdienste. Bereits vorhandene Termine am selben Tag werden nicht doppelt angelegt.</p>' +
      '<label for="serMonth">Monat</label>' +
      '<select id="serMonth">' + monthOptionsHtml() + '</select>' +
      '<label for="serOrt">Ort der gemeinsamen Mittwochsgottesdienste</label>' +
      '<select id="serOrt"><option value="boele">Boele</option><option value="hohenlimburg">Hohenlimburg</option></select>' +
      '<button class="btn-primary" id="serSubmit">Serie erstellen</button>' +
      '<div id="serMsg" class="hint" style="display:none;"></div>' +
      '</div>';

    html += '<div id="admSingleBoxWrap"></div>';

    html += '<div id="dlBoxWrap"></div>';

    html += '<div class="card"><p class="section-title">Amtsträger</p><div id="amList"></div></div>';

    html += '<div class="card"><p class="section-title">Bestehende Termine</p><div id="admList"></div></div>';

    html += '<div class="card">' +
      '<p class="section-title" style="color:var(--red);">Testphase: Alle Daten löschen</p>' +
      '<p class="termin-sub">Löscht unwiderruflich alle Termine, Anwesenheiten, Bemerkungen, Urlaubstage und registrierten Amtsträger. Der Admin-Zugangscode bleibt erhalten. Dieser Button ist nur für die Testphase gedacht und wird danach wieder entfernt.</p>' +
      '<button class="btn-primary" id="resetAllBtn" style="background:var(--red);">Alle Eingaben löschen</button>' +
      '<div id="resetMsg" class="hint" style="display:none;"></div>' +
      '</div>';

    el.innerHTML = html;

    document.getElementById('serSubmit').addEventListener('click', createSeries);
    document.getElementById('resetAllBtn').addEventListener('click', resetAllData);

    renderAdmSingleBox();
    renderDlBox();
    renderAmtstraegerList();
    renderTermineList();
  }

  function resetAllData(){
    var msg = document.getElementById('resetMsg');
    var sure = confirm('Wirklich ALLE Termine, Anwesenheiten, Bemerkungen, Urlaubstage und Amtsträger unwiderruflich löschen?');
    if (!sure) return;
    var sicher = confirm('Letzte Sicherheitsabfrage: Es gibt kein Zurück. Wirklich alles löschen?');
    if (!sicher) return;
    var collections = ['termine', 'status', 'urlaub', 'amtstraeger'];
    var tasks = collections.map(function(colName){
      return db.collection(colName).get().then(function(snap){
        var batch = db.batch();
        snap.docs.forEach(function(d){ batch.delete(d.ref); });
        return batch.commit();
      });
    });
    Promise.all(tasks).then(function(){
      if (msg) { msg.textContent = 'Alle Daten wurden gelöscht.'; msg.style.display = 'block'; }
    }).catch(function(){
      if (msg) { msg.textContent = 'Beim Löschen ist ein Fehler aufgetreten.'; msg.style.display = 'block'; }
    });
  }

  var admSingleBoxOpen = false;
  function renderAdmSingleBox(){
    var wrap = document.getElementById('admSingleBoxWrap');
    if (!wrap) return;
    wrap.innerHTML = '<div class="card ueb-card">' +
      '<div class="ueb-head" id="admSingleBoxHead">' +
        '<p class="section-title" style="margin-bottom:2px;">Einzelnen Termin anlegen</p>' +
        '<span class="ueb-toggle">' + (admSingleBoxOpen ? 'Einklappen ▴' : 'Aufklappen ▾') + '</span>' +
      '</div>' +
      '<div class="ueb-persons" id="admSingleBoxBody" style="display:' + (admSingleBoxOpen ? 'block' : 'none') + ';">' +
        '<label for="admDatum" style="margin-top:10px;">Datum</label>' +
        '<input type="date" id="admDatum">' +
        '<label for="admZeit">Uhrzeit</label>' +
        '<input type="time" id="admZeit" value="10:00">' +
        '<label for="admBez">Bezeichnung</label>' +
        '<input type="text" id="admBez" placeholder="z. B. Sonntagsgottesdienst">' +
        '<div class="checkline"><input type="checkbox" id="admGemeinsam"><label for="admGemeinsam" style="margin:0;">Gemeinsamer Termin (beide Gemeinden)</label></div>' +
        '<div id="admGemeindeWrap"><label for="admGemeinde" id="admGemeindeLabel">Gemeinde</label>' +
        '<select id="admGemeinde"><option value="boele">Boele</option><option value="hohenlimburg">Hohenlimburg</option></select></div>' +
        '<label for="admDienstleiter">Dienstleiter (optional)</label>' +
        '<input type="text" id="admDienstleiter" placeholder="Name eintragen">' +
        '<button class="btn-primary" id="admSubmit">Termin anlegen</button>' +
        '<div id="admError" class="error-msg" style="display:none;"></div>' +
      '</div>' +
    '</div>';
    wrap.querySelector('#admSingleBoxHead').addEventListener('click', function(){
      admSingleBoxOpen = !admSingleBoxOpen;
      renderAdmSingleBox();
    });
    if (admSingleBoxOpen) {
      document.getElementById('admGemeinsam').addEventListener('change', function(){
        document.getElementById('admGemeindeLabel').textContent = this.checked ? 'Ort des gemeinsamen Gottesdienstes' : 'Gemeinde';
      });

  var dlBoxOpen = false;
  var dlGemeinde = 'boele';
  function terminOrt(t){
    var key = t.gemeinsam ? t.ort : t.gemeinde;
    return GEMEINDEN[key] || '';
  }
  function renderDlBox(){
    var wrap = document.getElementById('dlBoxWrap');
    if (!wrap) return;
    wrap.innerHTML = '<div class="card ueb-card">' +
      '<div class="ueb-head" id="dlBoxHead">' +
        '<p class="section-title" style="margin-bottom:2px;">Dienstleiter Schnelleingabe</p>' +
        '<p class="hint" style="margin:0;">Dienstleiter für einen ganzen Monat in einem Rutsch eintragen</p>' +
        '<span class="ueb-toggle">' + (dlBoxOpen ? 'Einklappen ▴' : 'Aufklappen ▾') + '</span>' +
      '</div>' +
      '<div class="ueb-persons" id="dlBoxBody" style="display:' + (dlBoxOpen ? 'block' : 'none') + ';">' +
        '<p class="termin-sub" style="margin-top:10px;">Monat und Gemeinde wählen, dann die Dienstleiter zeilenweise eintragen – Zeile 1 gilt für den ersten Termin in der Liste unten, Zeile 2 für den zweiten usw. Die Ämterstunde ist hier nicht enthalten. Eine leere Zeile löscht den bisherigen Dienstleiter des jeweiligen Termins.</p>' +
        '<label for="dlMonth">Monat</label>' +
        '<select id="dlMonth">' + dlMonthOptionsHtml() + '</select>' +
        '<label for="dlGemeinde">Gemeinde</label>' +
        '<select id="dlGemeinde">' +
          '<option value="boele"' + (dlGemeinde==='boele'?' selected':'') + '>Boele</option>' +
          '<option value="hohenlimburg"' + (dlGemeinde==='hohenlimburg'?' selected':'') + '>Hohenlimburg</option>' +
        '</select>' +
        '<div id="dlListPreview"></div>' +
        '<label for="dlNames">Dienstleiter (eine Zeile pro Termin, in der Reihenfolge der Liste oben)</label>' +
        '<textarea id="dlNames" placeholder="Name Termin 1' + String.fromCharCode(10) + 'Name Termin 2' + String.fromCharCode(10) + '..."></textarea>' +
        '<button class="btn-primary" id="dlSubmit">Übernehmen</button>' +
        '<div id="dlMsg" class="hint" style="display:none;"></div>' +
      '</div>' +
    '</div>';
    wrap.querySelector('#dlBoxHead').addEventListener('click', function(){
      dlBoxOpen = !dlBoxOpen;
      renderDlBox();
    });
    if (dlBoxOpen) {
      var dlMonthSel = document.getElementById('dlMonth');
      var dlGemeindeSel = document.getElementById('dlGemeinde');
      renderDlPreview(dlMonthSel.value, dlGemeindeSel.value);
      dlMonthSel.addEventListener('change', function(){ renderDlPreview(this.value, dlGemeindeSel.value); });
      dlGemeindeSel.addEventListener('change', function(){ dlGemeinde = this.value; renderDlPreview(dlMonthSel.value, dlGemeinde); });
      document.getElementById('dlSubmit').addEventListener('click', submitDlNames);
    }
  }
  function dlMonthOptionsHtml(){
    var set = {};
    termine.forEach(function(t){ if (t.datum) set[t.datum.slice(0,7)] = true; });
    var months = Object.keys(set).sort();
    if (!months.length) return '<option value="">Keine Termine vorhanden</option>';
    return months.map(function(m){
      var p = m.split('-'); var mi = parseInt(p[1],10)-1;
      return '<option value="' + m + '">' + (MONATSNAMEN[mi]||'') + ' ' + p[0] + '</option>';
    }).join('');
  }
  function terminePerMonthGemeinde(monthVal, gemeinde){
    return termine.filter(function(t){
      return (t.datum||'').slice(0,7) === monthVal &&
        t.bezeichnung !== 'Ämterstunde' &&
        (t.gemeinsam || t.gemeinde === gemeinde);
    }).slice().sort(sortByDatumZeit);
  }
  function renderDlPreview(monthVal, gemeinde){
    var el = document.getElementById('dlListPreview');
    if (!el) return;
    var list = terminePerMonthGemeinde(monthVal, gemeinde);
    if (!list.length) { el.innerHTML = '<p class="hint">Keine Termine für diese Auswahl.</p>'; return; }
    var html = '<ol class="dl-preview">';
    list.forEach(function(t){
      var f = fmtDatum(t.datum);
      html += '<li>' + f.tag + ', ' + f.datum + (t.uhrzeit ? ' · ' + t.uhrzeit : '') + ' – ' + escapeHtml(t.bezeichnung||'') +
        ' · ' + escapeHtml(terminOrt(t)) +
        (t.dienstleiter ? ' (bisher: ' + escapeHtml(t.dienstleiter) + ')' : '') + '</li>';
    });
    html += '</ol>';
    el.innerHTML = html;
  }
  function submitDlNames(){
    var monthVal = document.getElementById('dlMonth').value;
    var gemeinde = document.getElementById('dlGemeinde').value;
    var msg = document.getElementById('dlMsg');
    var list = terminePerMonthGemeinde(monthVal, gemeinde);
    if (!monthVal || !list.length) { msg.textContent = 'Keine Termine für diese Auswahl.'; msg.style.display = 'block'; return; }
    var lines = document.getElementById('dlNames').value.split('\n').map(function(l){ return l.trim(); });
    var extraHint = '';
    if (lines.length > list.length) {
      extraHint = 'Es wurden mehr Zeilen als Termine eingegeben – ' + (lines.length - list.length) + ' überzählige Zeile(n) wurden ignoriert. ';
    }
    var n = Math.min(lines.length, list.length);
    var promises = [];
    for (var i = 0; i < n; i++) {
      promises.push(db.collection('termine').doc(list[i].id).update({ dienstleiter: lines[i] || null, updatedAt: new Date().toISOString() }));
    }
    Promise.all(promises).then(function(){
      msg.textContent = extraHint + n + ' Dienstleiter wurden übernommen.';
      msg.style.display = 'block';
      document.getElementById('dlNames').value = '';
      renderDlPreview(monthVal, gemeinde);
    }).catch(function(){
      msg.textContent = 'Beim Speichern ist ein Fehler aufgetreten.'; msg.style.display = 'block';
    });
  }

  function existsTermin(datum, gemeinde, gemeinsam){
    return termine.some(function(t){
      return t.datum === datum && !!t.gemeinsam === !!gemeinsam && (gemeinsam || t.gemeinde === gemeinde);
    });
  }

  function createSeries(){
    var monthVal = document.getElementById('serMonth').value;
    var ortVal = document.getElementById('serOrt').value;
    var msg = document.getElementById('serMsg');
    if (!monthVal) { msg.textContent = 'Bitte einen Monat wählen.'; msg.style.display='block'; return; }
    var parts = monthVal.split('-');
    var year = parseInt(parts[0],10), month = parseInt(parts[1],10);
    var seriesId = monthVal + '-serie';
    var toCreate = [];
    var today = todayIso();

    // Ämterstunde: Donnerstag nach dem ersten Sonntag des Monats, am jeweils anderen Ort.
    var firstSunday = new Date(year, month-1, 1);
    while (firstSunday.getDay() !== 0) firstSunday.setDate(firstSunday.getDate()+1);
    var amterDatumObj = new Date(firstSunday);
    amterDatumObj.setDate(amterDatumObj.getDate()+4);
    var amterIso = amterDatumObj.getFullYear() + '-' + String(amterDatumObj.getMonth()+1).padStart(2,'0') + '-' + String(amterDatumObj.getDate()).padStart(2,'0');
    var amterOrt = ortVal === 'boele' ? 'hohenlimburg' : 'boele';

    var d = new Date(year, month-1, 1);
    while (d.getMonth() === month-1) {
      var iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      var wd = d.getDay();
      if (iso < today) {
        d.setDate(d.getDate()+1);
        continue;
      }
      if (wd === 3) {
        if (!existsTermin(iso, null, true)) {
          toCreate.push({ datum: iso, uhrzeit:'19:30', bezeichnung:'Mittwochsgottesdienst', gemeinsam:true, gemeinde:null, ort:ortVal, seriesId: seriesId });
        }
      } else if (wd === 0) {
        ['boele','hohenlimburg'].forEach(function(g){
          if (!existsTermin(iso, g, false)) {
            toCreate.push({ datum: iso, uhrzeit:'10:00', bezeichnung:'Sonntagsgottesdienst', gemeinsam:false, gemeinde:g, ort:null, seriesId: seriesId });
          }
        });
      } else if (iso === amterIso) {
        if (!existsTermin(iso, null, true)) {
          toCreate.push({ datum: iso, uhrzeit:'19:30', bezeichnung:'Ämterstunde', gemeinsam:true, gemeinde:null, ort:amterOrt, seriesId: seriesId });
        }
      }
      d.setDate(d.getDate()+1);
    }
    if (!toCreate.length) {
      msg.textContent = 'Für diesen Monat sind bereits alle Termine vorhanden.'; msg.style.display = 'block';
      return;
    }
    var now = new Date().toISOString();
    var promises = toCreate.map(function(t){
      t.createdAt = now;
      return db.collection('termine').add(t);
    });
    Promise.all(promises).then(function(){
      msg.textContent = toCreate.length + ' Termin(e) wurden angelegt.'; msg.style.display = 'block';
    }).catch(function(){
      msg.textContent = 'Beim Anlegen ist ein Fehler aufgetreten.'; msg.style.display = 'block';
    });
  }

  function createSingle(){
    var datum = document.getElementById('admDatum').value;
    var uhrzeit = document.getElementById('admZeit').value;
    var bez = document.getElementById('admBez').value.trim();
    var gemeinsam = document.getElementById('admGemeinsam').checked;
    var ausgewaehlt = document.getElementById('admGemeinde').value;
    var dienstleiter = document.getElementById('admDienstleiter').value.trim();
    var err = document.getElementById('admError');
    if (!datum) { err.textContent = 'Bitte ein Datum wählen.'; err.style.display='block'; return; }
    err.style.display = 'none';
    db.collection('termine').add({
      datum: datum, uhrzeit: uhrzeit || '', bezeichnung: bez || 'Gottesdienst',
      gemeinsam: gemeinsam,
      gemeinde: gemeinsam ? null : ausgewaehlt,
      ort: gemeinsam ? ausgewaehlt : null,
      dienstleiter: dienstleiter || null,
      seriesId: null, createdAt: new Date().toISOString()
    }).then(function(){
      document.getElementById('admDatum').value = '';
      document.getElementById('admBez').value = '';
      document.getElementById('admDienstleiter').value = '';
    }).catch(function(){
      err.textContent = 'Termin konnte nicht gespeichert werden.'; err.style.display = 'block';
    });
  }

  function renderTermineList(){
    var list = document.getElementById('admList');
    if (!list) return;
    if (!termine.length) { list.innerHTML = '<div class="empty" style="padding:16px 0;">Noch keine Termine.</div>'; return; }
    list.innerHTML = '';
    termine.slice().sort(sortByDatumZeit).forEach(function(t){
      var f = fmtDatum(t.datum);
      var row = document.createElement('div');
      row.className = 'termin-admin-row';
      row.innerHTML =
        '<div class="top-line">' +
          '<div class="info">' + tagHtml(t) + '<br>' + f.tag + ', ' + f.datum + (t.uhrzeit?' · '+t.uhrzeit:'') + ' <span class="sub">' + escapeHtml(t.bezeichnung||'') + (t.dienstleiter ? (' · Dienstleiter: ' + escapeHtml(t.dienstleiter)) : '') + '</span></div>' +
          '<div class="row-actions"><button class="btn-secondary editBtn">Bearbeiten</button><button class="btn-secondary btn-danger delBtn">Löschen</button></div>' +
        '</div><div class="edit-box" style="display:none;"></div>';
      row.querySelector('.delBtn').addEventListener('click', function(){
        db.collection('termine').doc(t.id).delete().catch(function(){});
        db.collection('status').where('terminId','==', t.id).get().then(function(snap){
          snap.docs.forEach(function(d){ db.collection('status').doc(d.id).delete().catch(function(){}); });
        }).catch(function(){});
      });
      row.querySelector('.editBtn').addEventListener('click', function(){
        var box = row.querySelector('.edit-box');
        var open = box.style.display !== 'none';
        if (open) { box.style.display = 'none'; box.innerHTML=''; return; }
        box.style.display = 'block';
        box.innerHTML =
          '<label>Datum</label><input type="date" class="e-datum" value="' + (t.datum||'') + '">' +
          '<label>Uhrzeit</label><input type="time" class="e-zeit" value="' + (t.uhrzeit||'') + '">' +
          '<label>Bezeichnung</label><input type="text" class="e-bez" value="' + escapeHtml(t.bezeichnung||'') + '">' +
          '<div class="checkline"><input type="checkbox" class="e-gemeinsam"' + (t.gemeinsam?' checked':'') + '><label style="margin:0;">Gemeinsamer Termin</label></div>' +
          '<div class="e-gwrap"><label class="e-glabel">' + (t.gemeinsam ? 'Ort des gemeinsamen Gottesdienstes' : 'Gemeinde') + '</label>' +
          '<select class="e-gemeinde"><option value="boele"' + ((t.gemeinsam?t.ort:t.gemeinde)==='boele'?' selected':'') + '>Boele</option>' +
          '<option value="hohenlimburg"' + ((t.gemeinsam?t.ort:t.gemeinde)==='hohenlimburg'?' selected':'') + '>Hohenlimburg</option></select></div>' +
          '<label>Dienstleiter (optional)</label><input type="text" class="e-dienstleiter" placeholder="Name eintragen" value="' + escapeHtml(t.dienstleiter||'') + '">' +
          '<button class="btn-primary e-save">Speichern</button>';
        box.querySelector('.e-gemeinsam').addEventListener('change', function(){
          box.querySelector('.e-glabel').textContent = this.checked ? 'Ort des gemeinsamen Gottesdienstes' : 'Gemeinde';
        });
        box.querySelector('.e-save').addEventListener('click', function(){
          var gem = box.querySelector('.e-gemeinsam').checked;
          var ausgewaehlt = box.querySelector('.e-gemeinde').value;
          db.collection('termine').doc(t.id).update({
            datum: box.querySelector('.e-datum').value,
            uhrzeit: box.querySelector('.e-zeit').value,
            bezeichnung: box.querySelector('.e-bez').value.trim() || 'Gottesdienst',
            gemeinsam: gem,
            gemeinde: gem ? null : ausgewaehlt,
            ort: gem ? ausgewaehlt : null,
            dienstleiter: box.querySelector('.e-dienstleiter').value.trim() || null,
            updatedAt: new Date().toISOString()
          }).then(function(){ box.style.display='none'; box.innerHTML=''; }).catch(function(){});
        });
      });
      list.appendChild(row);
    });
  }

  function renderAmtstraegerList(){
    var list = document.getElementById('amList');
    if (!list) return;
    if (!amtstraeger.length) { list.innerHTML = '<div class="empty" style="padding:16px 0;">Noch niemand eingetragen.</div>'; return; }
    list.innerHTML = '';
    amtstraeger.forEach(function(g){
      var row = document.createElement('div');
      row.className = 'am-row';
      row.innerHTML = '<span>' + escapeHtml(g.name) + '</span>';
      var right = document.createElement('span');
      right.style.display = 'flex'; right.style.gap = '6px'; right.style.alignItems = 'center'; right.style.flexWrap = 'wrap';
      var selG = document.createElement('select');
      selG.innerHTML = '<option value="boele">Boele</option><option value="hohenlimburg">Hohenlimburg</option>';
      selG.value = g.gemeinde;
      selG.addEventListener('change', function(){
        db.collection('amtstraeger').doc(g.id).update({ gemeinde: selG.value }).catch(function(){});
      });
      var selR = document.createElement('select');
      selR.innerHTML = '<option value="diakon">Diakon</option><option value="priester">Priester</option>';
      selR.value = g.rolle || 'diakon';
      selR.addEventListener('change', function(){
        db.collection('amtstraeger').doc(g.id).update({ rolle: selR.value }).catch(function(){});
      });
      var del = document.createElement('button');
      del.className = 'btn-secondary btn-danger'; del.textContent = 'Entfernen';
      del.addEventListener('click', function(){
        db.collection('amtstraeger').doc(g.id).delete().catch(function(){});
      });
      right.appendChild(selG); right.appendChild(selR); right.appendChild(del);
      row.appendChild(right);
      list.appendChild(row);
    });
  }

  // ---------- boot ----------
  function boot(){
    if (db) subscribeAll();
    if (savedName && savedGemeinde && savedRolle) {
      adminUnlocked = savedIsAdmin === '1';
      initPerson(savedName, savedGemeinde, savedRolle);
    } else {
      selectG(null); selectR(null); selectA('nein'); showOnboarding();
    }
  }
  boot();
})();
